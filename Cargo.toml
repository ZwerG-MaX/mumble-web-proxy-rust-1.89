[workspace]
resolver = "3"
members = ["proxy", "protocol", "rtp", "libnice", "libnice-sys", "sdp"]

[workspace.package]
edition = "2024"
rust-version = "1.89"

[workspace.dependencies]
bytes = "1.10"
byteorder = "1.5"
futures = "0.3.31"
http = "1.3"
libc = "0.2"
openssl = "0.10"
tokio = { version = "1.47", features = ["full"] }
tokio-util = { version = "0.7.16", default-features = false }
tokio-native-tls = "0.3"
native-tls = "0.2"
webrtc-sdp = { path = "sdp", version = "0.3.14" }
libnice-sys = { path = "libnice-sys", version = "0.4.0" }
libnice = { path = "libnice", version = "0.3.0" }
rtp = { path = "rtp", version = "0.1.0" }
mumble-protocol = { path = "protocol", version = "0.4.1" }
